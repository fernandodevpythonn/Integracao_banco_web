<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../static/pagina_login.css">
</head>
<body>
    <header>
        <h1>Página de cadastro</h1>
    </header>
    <main>
        <form action="{{ url_for('registrar')}}" method="POST">
            <fieldset>Cadastro</fieldset>
            <p>
                <label for="email">Email:</label>
                <input type="email" value="email" id="email" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" value="senha" id="senha" required>
            </p>
            <input type="submit" value="Cadastrar">
        </form>
    </main>
    
</body>
</html>
